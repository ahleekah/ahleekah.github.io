<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Music Demos</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      max-width: 500px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h1 {
      text-align: center;
      font-weight: 700;
    }
    .track-card {
      background: #1e293b;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    .track-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    audio {
      width: 100%;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h1>🎵 Music Demos</h1>

  <div class="track-card">
    <div class="track-title">1. ALL SKEET SKEET</div>
    <audio controls preload="metadata">
      <source src="audio/ALL SKEET SKEET.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </div>

  <div class="track-card">
    <div class="track-title">2. HAVE EVER SEEN SKEET</div>
    <audio controls preload="metadata">
      <source src="audio/HAVE EVER SEEN SKEET.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </div>

  <div class="track-card">
    <div class="track-title">3. SKEEETT SKEEET (FREE BALLIN)</div>
    <audio controls preload="metadata">
      <source src="audio/SKEEETT SKEEET (FREE BALLIN).mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </div>

  <div class="track-card">
    <div class="track-title">4. SKEET SKEET</div>
    <audio controls preload="metadata">
      <source src="audio/SKEET SKEET.mp3" type="audio/mpeg">

    </audio>
  </div>

  <div class="track-card">
    <div class="track-title">5. UNDA DA SKEET</div>
    <audio controls preload="metadata">
      <source src="audio/UNDA DA SKEET.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </div>

</body>
</html>
