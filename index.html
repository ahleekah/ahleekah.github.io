<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Audio Demos</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      max-width: 500px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h1 {
      text-align: center;
      font-weight: 700;
    }
    .track-card {
      background: #1e293b;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    .track-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    audio {
      width: 100%;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h1>🎵 Music Demos</h1>

  <!-- Track 1 -->
  <div class="track-card">
    <div class="track-title">1. Track 01</div>
    <audio controls preload="metadata">
